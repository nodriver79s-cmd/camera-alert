<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03060b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>단속카메라 경보</title>
<style>
/* VOICE: 고급 세단 순정 헤드유닛처럼 차분하고 또렷하게.
   IDEA: 검은 유리 화면 + 파란 실내조명 + 메탈 테두리 소프트키. 가로는 계기판 한 장.
   PICTURE: 제한속도 표지, 아주 큰 현재 속도, 거리 막대 게이지, 가로 배경엔 크롬 다이얼 무늬.
   COLOUR: 거의 검정 바탕, 인광 파랑 강조, 경고는 노랑·빨강만.
   TYPE/LAYOUT: 오프라인 시스템 한글 글꼴. 메인엔 시작·설정 두 버튼만. */
:root{--bg:#03060b;--blue:#56b8ff;--ink:#f5f9ff;--mute:#a7b7cc;--red:#ff3b30;--amber:#ffb400;--green:#3ad07f}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 -apple-system,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(120% 70% at 50% -10%,#10304f 0%,#061020 45%,#03060b 75%) fixed;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.app{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;max-width:980px;margin:0 auto;padding:12px}
.status{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 4px}
#clock{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.chip{font-size:14px;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid #24415f;background:#08121e;color:var(--mute);white-space:nowrap}
.chip.ok{color:#8fe3b4;border-color:#1d5a3b}.chip.warn{color:var(--amber);border-color:#5d4a0d}.chip.bad{color:#ff8f88;border-color:#6a2420}
.frame{padding:3px;border-radius:24px;background:linear-gradient(160deg,#cfd8e2 0%,#5d6a78 22%,#2a333e 50%,#8e9aa8 78%,#3a4450 100%);box-shadow:0 14px 40px rgba(0,0,0,.7)}
.screen{position:relative;height:100%;border-radius:21px;background:linear-gradient(180deg,#0b1626 0%,#050a12 100%);box-shadow:inset 0 0 0 1px #10243b;padding:18px;overflow:hidden;display:grid;align-content:center}
.screen::before{content:"";position:absolute;top:0;left:0;right:0;inset:0 0 auto 0;height:42%;background:linear-gradient(180deg,rgba(255,255,255,.05),transparent);pointer-events:none}
.dial{display:none;position:absolute;pointer-events:none;opacity:.16}
.top{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:14px;align-items:center}
.sign{justify-self:center;width:min(40vw,210px);aspect-ratio:1;border-radius:50%;background:#fff;border:16px solid var(--red);border:clamp(13px,3.6vw,20px) solid var(--red);display:grid;place-items:center;color:#0b0b0b;font-weight:900;font-size:clamp(52px,14vw,96px);letter-spacing:-3px;box-shadow:0 0 0 3px #0a0f16,0 0 24px rgba(255,59,48,.35)}
.sign.none{background:#0c1828;border-color:#22384f;color:#6f88a5;font-size:22px;letter-spacing:0;font-weight:700;box-shadow:inset 0 0 18px rgba(86,184,255,.12)}
.speed{text-align:center}
.speed b{display:block;font-size:clamp(92px,27vw,168px);line-height:.92;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-5px;color:#fff;text-shadow:0 0 22px rgba(86,184,255,.35)}
.speed span{display:block;margin-top:4px;color:var(--blue);font-size:20px;font-weight:700;letter-spacing:.06em}
.side{grid-column:1/-1}
.info{margin-top:12px;padding-top:12px;border-top:1px solid #142a44;text-align:center;min-height:62px}
.info .t{font-size:clamp(22px,5.6vw,30px);font-weight:800;color:#fff}
.info .p{font-size:18px;color:var(--mute);overflow-wrap:anywhere}
.gauge{margin-top:14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
#dist{font-size:clamp(30px,8vw,46px);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:4.2em;text-align:right;color:var(--blue)}
.segs{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px;height:26px}
.segs i{border-radius:4px;background:#0f1e31;box-shadow:inset 0 0 0 1px #1a314c}
.segs i.on{background:var(--blue);box-shadow:0 0 10px rgba(86,184,255,.7)}
.segs i.on.a{background:var(--amber);box-shadow:0 0 10px rgba(255,180,0,.7)}
.segs i.on.r{background:var(--red);box-shadow:0 0 12px rgba(255,59,48,.8)}
body.caution .screen{box-shadow:inset 0 0 0 3px var(--amber),inset 0 0 50px rgba(255,180,0,.18)}
body.caution #dist{color:var(--amber)}
body.alarm .screen{background:linear-gradient(180deg,#3a0705,#12020a);box-shadow:inset 0 0 0 4px var(--red),inset 0 0 70px rgba(255,59,48,.45)}
body.alarm .speed b{color:#ffd9d6;text-shadow:0 0 26px rgba(255,59,48,.9)}
body.alarm #dist{color:#ffb3ad}
@media (prefers-reduced-motion:no-preference){body.alarm .screen{animation:pulse 1s steps(2) infinite}@keyframes pulse{50%{box-shadow:inset 0 0 0 4px transparent,inset 0 0 70px rgba(255,59,48,.2)}}}
#msg{min-height:26px;color:var(--amber);font-size:17px;font-weight:600;text-align:center}
.keys{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr);gap:10px}
.key{word-break:keep-all;position:relative;font:inherit;font-size:20px;font-weight:700;min-height:72px;padding:8px 6px;border-radius:14px;cursor:pointer;color:#eaf3ff;border:1px solid #2d5785;background:linear-gradient(180deg,#1a3553 0%,#0d1d31 55%,#091524 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -2px 6px rgba(0,0,0,.5),0 3px 8px rgba(0,0,0,.6);display:grid;place-items:center;text-align:center;line-height:1.2}
.key:active{transform:translateY(1px);box-shadow:inset 0 0 14px rgba(86,184,255,.5)}
.key.go{border-color:#5fb8ff;background:linear-gradient(180deg,#3d9bff 0%,#1d64c4 60%,#154c97 100%);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 0 18px rgba(86,184,255,.45),0 3px 8px rgba(0,0,0,.6)}
.key.go.on{border-color:#ff7a72;background:linear-gradient(180deg,#ff5a50 0%,#c9241b 60%,#9c1a13 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 18px rgba(255,59,48,.5)}
.key input{position:absolute;opacity:0;width:1px;height:1px}
.key:focus-visible,.key:focus-within,input:focus-visible,select:focus-visible,summary:focus-visible,.close:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.simbadge{display:none;position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:3;padding:6px 16px;border-radius:999px;background:var(--amber);color:#1a1200;font-weight:800;font-size:16px;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.6)}
body.sim .simbadge{display:block}
/* 설정 화면 */
.sheet{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:20;background:#03060b;overflow-y:auto;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.sheet[hidden]{display:none}
.sheet .in{max-width:860px;margin:0 auto;padding:12px 14px 40px}
.sheet header{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:10px 2px;background:linear-gradient(#03060b,rgba(3,6,11,.9));border-bottom:1px solid #12263d}
.sheet h2{margin:0;font-size:24px}
.close{font:inherit;font-size:18px;font-weight:700;min-height:52px;padding:6px 20px;border-radius:12px;border:1px solid #5fb8ff;background:linear-gradient(180deg,#3d9bff,#1d64c4);color:#fff;cursor:pointer}
.tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
.panel{scroll-margin-top:70px;margin-top:12px;border-radius:16px;border:1px solid #1b3350;background:linear-gradient(180deg,#0a1525,#060c16)}
summary{cursor:pointer;padding:16px 18px;font-weight:700;font-size:19px;min-height:56px;color:#dbe9fa;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"›";font-size:28px;color:var(--blue);transition:transform .2s}
details[open] summary::after{transform:rotate(90deg)}
.pad{padding:0 18px 18px}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid #12263d}
.row:first-child{border-top:0}
input[type=number],select{font:inherit;font-size:18px;min-height:50px;padding:6px 12px;border-radius:12px;border:1px solid #2a4b70;background:#050b14;color:var(--ink)}
input[type=number]{width:120px}select{width:min(100%,320px)}
input[type=range]{width:min(100%,260px);accent-color:var(--blue);height:32px}
input[type=checkbox]{width:28px;height:28px;accent-color:var(--blue)}
.btn2{font:inherit;font-size:17px;font-weight:700;min-height:50px;padding:6px 16px;border-radius:12px;border:1px solid #2d5785;background:linear-gradient(180deg,#1a3553,#0b1a2c);color:#eaf3ff;cursor:pointer}
ul.near{list-style:none;margin:0;padding:0}
ul.near li{display:grid;grid-template-columns:5em minmax(0,1fr) 3.4em;gap:12px;padding:12px 0;border-top:1px solid #12263d;align-items:center}
ul.near li:first-child{border-top:0}
.d{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;color:var(--blue);font-weight:800;font-size:19px}
.lim{justify-self:center;width:2.8em;height:2.8em;border-radius:50%;border:4px solid var(--red);background:#fff;color:#111;display:grid;place-items:center;font-weight:900;font-size:15px}
.lim.none{background:transparent;border-color:#2a3f57;color:var(--mute);font-weight:400}
.pl{overflow-wrap:anywhere;font-size:17px}.pl em{font-style:normal;color:var(--mute);font-size:15px;display:block}
p,ol li{color:#cfdbea}.mute{color:var(--mute);font-size:15px}
ol{padding-left:1.3em;margin:6px 0}ol li{margin:6px 0}
/* 소리 켜기 안내 */
.tap{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:15;max-width:92vw;padding:14px 22px;border-radius:999px;background:linear-gradient(180deg,#3d9bff,#1d64c4);color:#fff;font-weight:700;font-size:18px;text-align:center;box-shadow:0 0 0 2px #9fd4ff,0 8px 30px rgba(0,0,0,.7);border:0;cursor:pointer}
.tap[hidden]{display:none}
/* 가로 화면: 계기판 한 장 + 오른쪽 세로 버튼열 */
@media (orientation:landscape) and (min-width:560px){
  html,body{height:100%;overflow:hidden}
  .app{max-width:none;height:100dvh;height:100vh;height:100dvh;grid-template-columns:minmax(0,1fr) clamp(118px,15vw,170px);grid-template-rows:minmax(0,1fr);gap:10px;padding:8px 10px}
  .frame{grid-column:1;grid-row:1;min-height:0}
  .screen{padding:min(2.6vh,18px) min(2.4vw,26px);align-content:stretch}
  .dial{display:block;right:-6%;bottom:-40%;width:78%;height:auto}
  .top{grid-template-columns:auto minmax(0,1.05fr) minmax(0,1fr);gap:min(2.4vw,26px);height:100%;align-items:center}
  .sign{width:min(22vw,54vh,230px);border-width:min(3vw,5vh,20px);font-size:min(10vw,24vh,100px)}
  .speed b{font-size:min(17vw,40vh,200px);letter-spacing:-6px}
  .speed span{font-size:min(3vw,5vh,22px)}
  .side{grid-column:auto;display:grid;align-content:center;gap:min(3vh,18px);border-left:1px solid #142a44;padding-left:min(2.4vw,24px)}
  .info{margin:0;padding:0;border:0;text-align:left;min-height:0}
  .info .t{font-size:min(3vw,7.5vh,32px);text-wrap:balance}
  .info .p{font-size:min(2.4vw,5vh,20px)}
  .gauge{margin:0;grid-template-columns:minmax(0,1fr);gap:8px}
  #dist{text-align:left;min-width:0;font-size:min(6vw,13vh,64px)}
  .segs{height:min(6vh,30px)}
  .rail{grid-column:2;grid-row:1;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;gap:8px;min-height:0}
  .status{flex-direction:column;align-items:stretch;gap:6px;padding:0}
  #clock{text-align:center;font-size:min(4vw,8vh,34px)}
  .chips{flex-direction:column;align-items:stretch}.chip{text-align:center;font-size:13px}
  #msg{font-size:14px;text-align:center;align-self:center;overflow:hidden}
  .keys{grid-template-columns:minmax(0,1fr);grid-row:4/6;align-self:end}
  .key{min-height:min(14vh,62px);font-size:min(2.2vw,4.6vh,19px);padding:4px}
  .keys{gap:6px}
  #cVer{display:none}
  #msg{font-size:13px;line-height:1.3;max-height:5.2em;overflow:hidden}
  .chips{gap:4px}
  .tools{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (orientation:portrait),(max-width:559px){.rail{display:contents}.status{order:-1}}
/* ===== 구형 크롬(68 등) 대체 스타일: min()/clamp()/aspect-ratio/flex gap을 모르는 브라우저용 ===== */
@supports not (width: min(1px, 2px)) {
  .sign{width:170px;height:170px;border-width:16px;font-size:72px}
  .sign.none{font-size:20px}
  .speed b{font-size:120px}
  .info .t{font-size:24px}
  #dist{font-size:36px}
  .chips .chip{margin:0 0 4px 6px}
  .row>*+*{margin-left:10px}
  .status #clock{margin-right:8px}
  input[type=range]{width:220px}select{width:260px}
  @media (orientation:landscape) and (min-width:560px){
    .app{height:100vh}
    .sign{width:150px;height:150px;border-width:14px;font-size:64px}
    .speed b{font-size:130px}
    .info .t{font-size:24px}.info .p{font-size:16px}
    #dist{font-size:40px}.segs{height:22px}
    .key{min-height:54px;font-size:16px}
    .keys .key+.key{margin-top:6px}
    #clock{font-size:26px}
  }
}
/* ===== 정사각형 화면 (블랙베리 Q20 등): 화면 높이(vh)에 맞춰 모두 한 화면에 ===== */
@media (min-aspect-ratio:4/5) and (max-aspect-ratio:5/4) and (max-width:1000px){
  html,body{height:100%;overflow:hidden}
  body{font-size:4.2vh}
  .app{height:100vh;max-width:none;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;grid-gap:1.4vh;gap:1.4vh;padding:1.4vh}
  .rail{display:contents}.status{order:-1;flex-direction:row;align-items:center}
  .rail>div:empty{display:none}
  .status{padding:0 .6vh}
  #clock{font-size:5vh}
  .chips{flex-direction:row}
  .chip{font-size:3vh;padding:.3vh 1.8vh}
  .chips .chip{margin:0 0 0 1.2vh}
  .frame{border-radius:4.4vh;min-height:0;padding:.8vh}
  .screen{border-radius:3.6vh;padding:2.2vh 2.8vh;align-content:center}
  .top{grid-template-columns:31vh minmax(0,1fr);grid-gap:2.2vh;gap:2.2vh}
  .sign,.sign.none{width:29vh;height:29vh;border-width:2.8vh}
  .sign{font-size:12.8vh;letter-spacing:-.5vh}
  .sign.none{font-size:4.2vh}
  .speed b{font-size:22vh;letter-spacing:-.8vh}
  .speed span{font-size:3.6vh;margin-top:0}
  .side{grid-column:1/-1}
  .info{margin-top:1.1vh;padding-top:1.1vh;min-height:0}
  .info .t{font-size:4.7vh}
  .info .p{font-size:3.3vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gauge{margin-top:1.1vh;grid-gap:2.2vh;gap:2.2vh}
  #dist{font-size:6.1vh;min-width:0}
  .segs{height:3.6vh;grid-gap:.8vh;gap:.8vh}
  .simbadge{font-size:3vh;padding:.5vh 2.8vh;top:1.1vh}
  #msg{min-height:0;font-size:3.3vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .keys{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);grid-gap:1.6vh;gap:1.6vh;grid-row:auto}
  .key{min-height:12.8vh;font-size:4.4vh;border-radius:3vh;padding:.6vh}
  .tap{font-size:3.9vh;padding:2.8vh 3.9vh;bottom:17vh}
  .sheet .in{padding:1.7vh 2.2vh 8vh}
  .sheet header{padding:1.1vh .6vh}.sheet h2{font-size:5.3vh}.close{min-height:11vh;padding:1.1vh 3.9vh;font-size:4.2vh}
  .sheet .tools{grid-template-columns:repeat(4,minmax(0,1fr));grid-gap:1.6vh;gap:1.6vh;margin:2.2vh 0}
  .sheet .tools .key{min-height:12.8vh;font-size:3.4vh;line-height:1.15;padding:1.1vh;border-radius:2.8vh}
  .panel{margin-top:1.6vh;border-radius:3.6vh}
  summary{font-size:4.4vh;min-height:13vh;padding:3.3vh 3.9vh}
  .pad{padding:0 3.9vh 3.9vh}
  .row{padding:2.8vh 0}
  .row label{font-size:4.2vh}.mute{font-size:3.6vh}
  input[type=checkbox]{width:7.2vh;height:7.2vh}
  select,input[type=number]{font-size:4.2vh;min-height:11vh}
}


@media(max-width:430px){.tools{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app">
  <div class="frame"><section class="screen" aria-live="polite">
    <svg class="dial" viewBox="0 0 400 400" aria-hidden="true">
      <defs><linearGradient id="ch" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9f1fa"/><stop offset=".45" stop-color="#6e7d8f"/><stop offset=".7" stop-color="#cfd9e4"/><stop offset="1" stop-color="#4b5866"/></linearGradient></defs>
      <circle cx="200" cy="200" r="190" fill="none" stroke="url(#ch)" stroke-width="3"/>
      <circle cx="200" cy="200" r="168" fill="none" stroke="url(#ch)" stroke-width="1.2"/>
      <circle cx="200" cy="200" r="112" fill="none" stroke="#56b8ff" stroke-width="1" stroke-dasharray="2 6"/>
      <line x1="200" y1="14" x2="200" y2="40" stroke="url(#ch)" stroke-width="4" stroke-linecap="round"/>
      <g id="ticks" stroke="#9fb3c8" stroke-width="2" stroke-linecap="round"></g>
      <path d="M60 300 A160 160 0 0 1 340 300" fill="none" stroke="#56b8ff" stroke-width="6" stroke-linecap="round" opacity=".55"/>
    </svg>
    <div class="simbadge" aria-hidden="true" data-i18n="simBadge"></div>
    <div class="top">
      <div class="sign none" id="sign">—</div>
      <div class="speed"><b id="spd">0</b><span>km/h</span></div>
      <div class="side">
        <div class="info" id="info"><div class="t"></div><div class="p"></div></div>
        <div class="gauge"><div id="dist">— m</div><div class="segs" id="segs"></div></div>
      </div>
    </div>
  </section></div>
  <div class="rail">
    <div class="status"><div id="clock">--:--</div><div class="chips"><span class="chip" id="cDb"></span><span class="chip" id="cGps"></span><span class="chip" id="cVer"></span></div></div>
    <div id="msg" role="status"></div>
    <div></div>
    <div class="keys">
      <button class="key go" id="bStart" data-i18n="start"></button>
      <button class="key" id="bSet" data-i18n="settings"></button>
      <button class="key" id="bStartSet2" data-i18n="secStart"></button>
    </div>
  </div>
</div>

<button class="tap" id="tap" hidden data-i18n="tapToEnable"></button>
<div id="copyWarn" hidden style="position:fixed;left:0;right:0;top:0;z-index:30;background:#ff3b30;color:#fff;padding:12px 14px;font-weight:800;font-size:16px;line-height:1.4;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.6)"></div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="shTitle"><div class="in">
  <header><h2><span id="shTitle" data-i18n="settings"></span> <small id="ver" style="font-size:13px;color:#8fa6bf;font-weight:600"></small></h2><button class="close" id="bClose" data-i18n="close"></button></header>

function idb() { return new Promise((res, rej) => { const r = indexedDB.open('camalert', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }

async function dbGet(k) { const db = await idb(); return new Promise((res, rej) => { const r = db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }

/* 음성: 고른 언어의 부드러운 여성 목소리를 우선 */
function langVoices() { try { const re = S.lang === 'en' ? /^en/i : /^ko/i; return speechSynthesis.getVoices().filter(v => re.test(v.lang)); } catch (e) { return []; } }
function voiceScore(v) {
  const n = (v.name + ' ' + (v.voiceURI || '')).toLowerCase(); let s = 0;
  if (v.localService) s += 50;
  if (/network/.test(n)) s -= 40;
  if (/enhanced|premium|고품질|향상/.test(n)) s += 15;
  if (S.lang === 'en') {
    if (/en[-_]us/i.test(v.lang)) s += 10;
    if (/samantha|siri|ava|allison|karen|susan|zoe|female|sfg|tpf|iog/.test(n)) s += 30;
    if (/\b(daniel|alex|fred|tom|aaron|male)\b|iol|iom|tpd/.test(n) && !/female/.test(n)) s -= 30;
  } else {
    if (/yuna|siri|유나/.test(n)) s += 40;
    if (/female|여성|ism|kob|sora|heami|seoyeon|sunhi|jimin/.test(n)) s += 20;
    if (/male|남성|koc|kod|injoon|hyunsu|minho/.test(n) && !/female/.test(n)) s -= 30;
  }
  return s;
}
const vKey = () => 'voice_' + S.lang;
function pickVoice() {
  const vs = langVoices(); if (!vs.length) return null;
  if (S[vKey()]) { const v = vs.find(x => x.name === S[vKey()]); if (v) return v; }
  return vs.slice().sort((a, b) => voiceScore(b) - voiceScore(a))[0];
}
function fillVoices() {
  const sel = $('sVoiceName'), vs = langVoices().slice().sort((a, b) => voiceScore(b) - voiceScore(a));
  sel.textContent = '';
  const auto = document.createElement('option'); auto.value = ''; auto.textContent = T('voiceAuto'); sel.appendChild(auto);
  vs.forEach(v => { const o = document.createElement('option'); o.value = v.name; o.textContent = v.name + (v.localService ? '' : T('voiceNet')); sel.appendChild(o); });
  sel.value = vs.some(v => v.name === S[vKey()]) ? S[vKey()] : '';
  const p = pickVoice();
  $('voiceNote').textContent = !('speechSynthesis' in window) ? T('voiceUnsupported') : (vs.length ? T('voiceNow', { v: p ? p.name : '-' }) : T('voiceNone'));
}
function say(t, force) {
  if ((!force && !useVoice()) || !('speechSynthesis' in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = locale(); const v = pickVoice(); if (v) u.voice = v; u.rate = +S.rate || 1; u.pitch = +S.pitch || 1; u.volume = 1; speechSynthesis.speak(u); } catch (e) {}
}

function bindSettings() {

/* 소리 */
let master = null;
/* 슬라이더 값(예전 크기 대비 배수) → 실제 음량. 측정으로 맞춘 표 */
const VOL_MAP = [[0.5, 0.27], [0.75, 0.4], [1, 0.55], [1.26, 0.7], [1.43, 0.8], [1.58, 0.9], [1.73, 1.0], [2.01, 1.2], [2.26, 1.4]];
function volGain(v) { v = Math.max(0.5, Math.min(2.2, +v || 1)); for (let i = 1; i < VOL_MAP.length; i++) { const [x1, y1] = VOL_MAP[i - 1], [x2, y2] = VOL_MAP[i]; if (v <= x2) return y1 + (y2 - y1) * (v - x1) / (x2 - x1); } return 1.3; }
function ensureAudio() {
  try {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      /* 크게 키워도 찢어지지 않도록: 음량 → 부드러운 클리퍼 → 스피커 */
      const ws = actx.createWaveShaper(), N = 2048, cu = new Float32Array(N), K = 1.5;
      for (let i = 0; i < N; i++) { const x = i / (N - 1) * 2 - 1; cu[i] = Math.tanh(K * x) / Math.tanh(K); }
      ws.curve = cu; ws.oversample = '4x';
      master = actx.createGain(); master.gain.value = volGain(S.vol);
      master.connect(ws); ws.connect(actx.destination);
    }
    if (actx.state === 'suspended') actx.resume();
  } catch (e) {}
}
function chime(n = 1, f = 1046, gap = 0.2) {
  if (!useChime() || !actx || !master) return;
  try {
    for (let k = 0; k < n; k++) {
      const t = actx.currentTime + k * gap, g = actx.createGain();
      g.connect(master);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.55, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
      /* 기본음 + 한 옥타브 위 배음: 더 또렷하게 들림 */
      [[f, 1], [f * 2, 0.3]].forEach(([fq, a]) => { const o = actx.createOscillator(), og = actx.createGain(); o.type = 'sine'; o.frequency.value = fq; og.gain.value = a; o.connect(og); og.connect(g); o.start(t); o.stop(t + 0.44); });
    }
  } catch (e) {}
}
function setVol(v) { S.vol = v; saveS(); if (master) master.gain.setValueAtTime(volGain(v), actx.currentTime); $('volNote').textContent = T('volNote', { v: Math.round(v * 100) }); }
/* 화면 꺼짐 방지 (설정에서 켜고 끔): 최신 폰은 Wake Lock,
   구형(크롬 84 미만, 블랙베리 Q20 등)은 작은 무음 영상을 반복 재생 */

function noSleepVideo(on) {
  try {
    if (!nsVid) {
      if (!on) return;
      nsVid = document.createElement('video');
      nsVid.setAttribute('muted', ''); nsVid.muted = true; nsVid.setAttribute('playsinline', ''); nsVid.loop = true;
      nsVid.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;opacity:0.01;pointer-events:none';
      [['webm', NS_WEBM], ['mp4', NS_MP4]].forEach(([t, u]) => { const e = document.createElement('source'); e.type = 'video/' + t; e.src = u; nsVid.appendChild(e); });
      document.body.appendChild(nsVid);
    }
    if (on) { const p = nsVid.play(); if (p && p.catch) p.catch(() => {}); } else nsVid.pause();
  } catch (e) {}
}
async function lockScreen() {
  if (!S.awake) return;
  if ('wakeLock' in navigator) { try { if (!wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } return; } catch (e) {} }
  noSleepVideo(true);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && (watchId != null || simTimer)) lockScreen(); });

function setGps(text, cls) { const el = $('cGps'); el.textContent = text; el.className = 'chip ' + (cls || ''); }
function setState(k) { uiState = k; if (k === 'target') return; const [t, p] = T(k); $('info').innerHTML = `<div class="t">${esc(t)}</div><div class="p">${esc(p)}</div>`; }

function render(speed, lat, target, over, far) {
  $('spd').textContent = speed == null ? '0' : Math.round(speed);
  const sign = $('sign');
  if (target) {
    const c = act[target.i];
    if (c[3]) { sign.className = 'sign'; sign.textContent = c[3]; } else { sign.className = 'sign none'; sign.textContent = typeName(c[2]); }
    uiState = 'target';
    $('info').innerHTML = `<div class="t">${esc(c[5] ? T('section') : typeName(c[2]) + T('camSuffix'))}${c[6] ? ' · ' + esc(T('zone')) : ''}</div><div class="p">${esc(c[4] || '')}</div>`;
    gauge(target.d, far);
  } else {
    sign.className = 'sign none'; sign.textContent = '—'; gauge(null, far);
    setState(lat == null ? 'stLocating' : (lastHead == null ? 'stIdle' : 'stClear'));
  }
  document.body.classList.toggle('alarm', !!over);
  document.body.classList.toggle('caution', !over && !!target && target.d <= S.near);
}
let lastNear = [];
function renderNear(list, lat) {
  lastNear = list || [];
  const ul = $('near'), line = t => `<li><span class="d">—</span><span class="pl">${esc(t)}</span><span></span></li>`;
  if (!act.length) { ul.innerHTML = line(T('nearNeedData')); return; }
  if (lat == null) { ul.innerHTML = line(T('nearWait')); return; }
  if (!lastNear.length) { ul.innerHTML = line(T('nearNone')); return; }
  ul.innerHTML = lastNear.slice(0, 6).map(n => { const c = act[n.i]; if (!c) return ''; return `<li><span class="d">${n.d < 1000 ? Math.round(n.d) + ' m' : (n.d / 1000).toFixed(1) + ' km'}</span><span class="pl">${esc(c[4] || T('noPlace'))}<em>${esc(c[5] ? T('section') : typeName(c[2]))}${c[6] ? ' · ' + esc(T('zone')) : ''}</em></span><span class="lim${c[3] ? '' : ' none'}">${c[3] || '—'}</span></li>`; }).join('');
}
function sayPhrase(kind, c, d) { const m = Math.max(50, Math.round(d / 50) * 50); return T('say_' + kind)(m, c); }

let spdBuf = [], hist = [];
function onPos(p) {
  const { latitude: lat, longitude: lon, speed, heading, accuracy } = p.coords, ts = p.timestamp || Date.now();
  const acc = accuracy == null ? 999 : accuracy, isSim = !!p.sim;
  lastFix = { lat, lon };
  const weak = acc > 50;
  setGps(isSim ? T('gpsSim') : (weak ? T('gpsWeak', { a: Math.round(acc) }) : T('gpsOk', { a: Math.round(acc) })), isSim || weak ? 'warn' : 'ok');
  /* 속도: 폰 GPS 칩이 계산한 속도를 우선. 없을 때만 3초 이상 꾸준한 이동을 속도로 인정 */
  let raw = (speed != null && !isNaN(speed) && speed >= 0) ? speed * 3.6 : null;
  hist.push({ lat, lon, ts, acc }); while (hist.length > 6) hist.shift();
  if (raw == null && hist.length >= 4) {
    const h = hist.slice(-4), o = h[0], dt = (ts - o.ts) / 1000;
    let mono = true; for (let k = 1; k < h.length; k++) { if (dist(o.lat, o.lon, h[k].lat, h[k].lon) <= dist(o.lat, o.lon, h[k - 1].lat, h[k - 1].lon)) mono = false; }
    const dd = dist(o.lat, o.lon, lat, lon), maxAcc = Math.max(...h.map(x => x.acc));
    raw = (dt >= 2.5 && mono && maxAcc <= 30 && dd > maxAcc * 2.5) ? dd / dt * 3.6 : 0;
  }
  if (raw != null && raw > 260) raw = null;
  prev = { lat, lon, ts, acc };
  if (raw != null) { spdBuf.push(raw); if (spdBuf.length > 3) spdBuf.shift(); }
  let spd = spdBuf.length ? spdBuf.slice().sort((a, b) => a - b)[Math.floor(spdBuf.length / 2)] : null;
  if (weak && !isSim) spd = spd == null ? null : Math.min(spd, raw == null ? spd : raw);
  if (spd != null && spd < 4) spd = 0;
  let hd = (heading != null && !isNaN(heading) && spd != null && spd >= 8) ? heading : null;
  if (!anchor) anchor = { lat, lon };
  if (dist(anchor.lat, anchor.lon, lat, lon) >= Math.max(15, acc * 1.5)) { if (hd == null && spd != null && spd >= 8) hd = bearing(anchor.lat, anchor.lon, lat, lon); anchor = { lat, lon }; }
  if (hd != null) lastHead = hd;
  document.body.classList.toggle('sim', isSim);
  const far = (spd || 0) >= 90 ? Math.max(S.far, 800) : S.far;
  if (!act.length) { render(spd, lat, null, false, far); renderNear([], lat); return; }
  const list = nearby(grid, act, lat, lon, Math.max(far + 200, 1500));
  renderNear(list, lat);
  const target = (spd != null && spd >= 8 && (isSim || acc <= 50)) ? pickAhead(list.filter(n => n.d <= far + 200), act, lat, lon, lastHead, S.cone) : null;
  const now = Date.now(), ev = step(target, far, S.near, now);
  if (target) {
    const c = act[target.i];
    if (ev.includes('near')) { chime(2, 1175); say(sayPhrase('near', c, target.d)); }
    else if (ev.includes('far')) { chime(1, 988); say(sayPhrase('far', c, target.d)); }
  }
  const c = target && act[target.i];
  const over = !!(c && c[3] && target.d <= far && spd != null && spd > c[3] + S.tol);
  if (over && now - lastBeep > 1800) { lastBeep = now; chime(3, 1397, 0.14); if (now - lastOverSay > 12000) { lastOverSay = now; setTimeout(() => say(T('say_over')), 700); } }
  render(spd, lat, target, over, far);
}
function onErr(e) {
  const t = { 1: T('errDenied'), 2: T('errUnavail'), 3: T('errTimeout') }[e.code] || (T('errOther') + e.message);
  setGps(e.code === 1 ? T('gpsDenied') : T('gpsWait'), e.code === 1 ? 'bad' : 'warn'); msg(t);
}

function stopAll() {
  if (watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  if (simTimer) { clearInterval(simTimer); simTimer = null; }
  try { if (wake) wake.release(); } catch (e) {}
  noSleepVideo(false);
  wake = null; prev = null; anchor = null; lastHead = null; spdBuf = []; hist = []; step = createEngine(); document.body.classList.remove('sim');
  $('bStart').textContent = T('start'); $('bStart').classList.remove('on'); $('bSim').textContent = T('simulate');
  document.body.classList.remove('alarm', 'caution'); setGps(T('gpsOff'), '');
}
function start() {
  ensureAudio();
  if (!('geolocation' in navigator)) { msg(T('noGeo')); return; }
  if (!window.isSecureContext) msg(T('insecure')); else if (!all.length) msg(T('needData')); else msg('');
  stopAll();
  watchId = navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
  setGps(T('gpsSearch'), 'warn'); lockScreen(); render(0, null, null, false, S.far);
  $('bStart').textContent = T('stop'); $('bStart').classList.add('on');
}
function sim() {
  ensureAudio();
  if (simTimer) { stopAll(); msg(T('simStopped')); return; }
  if (!act.length) { msg(T('needData')); return; }
  stopAll();
  let cam = null;
  if (lastFix) { const n = nearby(grid, act, lastFix.lat, lastFix.lon, 1500).find(x => act[x.i][3] > 0); if (n) cam = act[n.i]; }
  if (!cam) cam = act.find(c => c[3] > 0) || act[0];
  const kmh = Math.max(40, (cam[3] || 50) + 15), mps = kmh / 3.6;
  let pos = offset(cam[0], cam[1], 180, 900), n = 0;
  msg(T('simStart', { p: cam[4] || T('camera'), k: kmh }));
  simTimer = setInterval(() => {
    pos = offset(pos[0], pos[1], 0, mps); n++;
    onPos({ sim: true, coords: { latitude: pos[0], longitude: pos[1], speed: mps, heading: 0, accuracy: 5 }, timestamp: Date.now() });
    if (n * mps > 1050) { stopAll(); msg(T('simDone')); }
  }, 1000);
  lockScreen(); $('bSim').textContent = T('simStop'); closeSheet();
}

$('bStart').addEventListener('click', () => { if (watchId != null) { stopAll(); msg(''); } else start(); });
$('bSim').addEventListener('click', sim);
function testLine() { ensureAudio(); chime(1, 988); setTimeout(() => say(T('say_test')), useChime() ? 350 : 0); }
$('bTest').addEventListener('click', () => { testLine(); msg(S.mode === 'off' ? T('testMuted') : (useVoice() && !('speechSynthesis' in window) ? T('voiceUnsupported') : T('testMsg'))); });
$('bVoiceTest').addEventListener('click', () => { ensureAudio(); say(T('say_test'), true); });
/* 파일 읽기: 최신 브라우저는 file.arrayBuffer(), 구형(크롬 76 미만, Q20)은 FileReader */
function readFileBuf(f) {
  if (f.arrayBuffer) return f.arrayBuffer();
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error(T('readFail'))); r.readAsArrayBuffer(f); });
}
$('fIn').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  msg(T('reading'));
  try {
    const buf = await readFileBuf(f);
    const b = new Uint8Array(buf.slice ? buf.slice(0, 8) : buf);
    const head = String.fromCharCode.apply(null, Array.prototype.slice.call(new Uint8Array(buf, 0, Math.min(400, buf.byteLength))));
    if ((b[0] === 0xD0 && b[1] === 0xCF && b[2] === 0x11 && b[3] === 0xE0) || (b[0] === 0x50 && b[1] === 0x4B) || /<table|<html|urn:schemas-microsoft-com:office/i.test(head)) throw new Error(T('xlsFile'));
    let parsed;
    try { parsed = parseText(decodeBuf(buf)); } catch (er) { throw new Error(/위도/.test(er.message) ? T('noLatLon') : er.message); }
    const { cams, skipped } = parsed;
    if (!cams.length) throw new Error(T('noCams'));
    all = cams; meta = { name: f.name, count: cams.length, date: new Date().toLocaleDateString(locale()) };
    try { await dbPut('cams', all); await dbPut('meta', meta); } catch (er) { msg(T('saveFail')); }
    applyFilter(); showMeta(); renderNear([], lastFix && lastFix.lat);
    if (watchId == null && !simTimer) { if (S.auto) start(); else setState('stPressStart'); }
    msg(T('loaded', { n: cams.length.toLocaleString(locale()), s: skipped ? T('loadedSkip', { n: skipped.toLocaleString(locale()) }) : '' }));
  } catch (er) { msg(T('loadFail') + er.message); }
  e.target.value = '';
});
/* 앱 새 버전 받기: 오프라인 저장본과 sw를 지우고 다시 불러옴 (카메라 데이터·설정은 유지) */
$('bUpdate').addEventListener('click', async () => {
  if (navigator.onLine === false) { msg(T('updateOffline')); return; }
  msg(T('updating'));
  try { if ('serviceWorker' in navigator) { const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(r => r.unregister())); } } catch (e) {}
  try { if (window.caches) { const ks = await caches.keys(); await Promise.all(ks.filter(k => /^camalert/.test(k)).map(k => caches.delete(k))); } } catch (e) {}
  setTimeout(() => { location.replace(location.pathname + '?u=' + Date.now()); }, 300);
});
$('bClear').addEventListener('click', async () => {
  const b = $('bClear');
  if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = T('clearSure'); setTimeout(() => { b.dataset.sure = ''; b.textContent = T('clear'); }, 4000); return; }
  all = []; meta = null; try { await dbPut('cams', []); await dbPut('meta', null); } catch (e) {}
  applyFilter(); showMeta(); renderNear([]); b.dataset.sure = ''; b.textContent = T('clear'); msg(T('cleared'));
});
if ('speechSynthesis' in window) { try { speechSynthesis.getVoices(); speechSynthesis.addEventListener('voiceschanged', fillVoices); } catch (e) {} }

/* 화면 방향 */
function applyOrient() {
  try {
    const o = screen.orientation; if (!o) return;
    if (S.orient === 'any') { if (o.unlock) o.unlock(); $('orientNote').textContent = T('orientNoteAny'); return; }
    o.lock(S.orient === 'landscape' ? 'landscape' : 'portrait').then(() => { $('orientNote').textContent = S.orient === 'landscape' ? T('orientNoteLand') : T('orientNotePort'); })
      .catch(() => { $('orientNote').textContent = T('orientNoteFail'); });
  } catch (e) {}
}
$('sOrient').value = S.orient || 'any';
$('sOrient').addEventListener('change', e => { S.orient = e.target.value; saveS(); applyOrient(); });

/* 설정 화면 */
function openSheet() { $('sheet').hidden = false; $('sheet').scrollTop = 0; try { $('bClose').focus({ preventScroll: true }); } catch (e) {} }
/* 작은 화면(Q20 등)에서는 칸을 모두 접어서 제목이 한눈에 보이게 */
if (window.innerHeight < 600) document.querySelectorAll('#sheet details[open]').forEach(d => d.removeAttribute('open'));
function closeSheet() { $('sheet').hidden = true; }
$('bSet').addEventListener('click', openSheet);
/* 시작 설정 바로 가기 버튼: 칸을 펼치고 그 위치로 이동 */
function goStartSettings() { const d = $('dStart'), sh = $('sheet'); d.open = true; const hd = sh.querySelector('header'); sh.scrollTop += d.getBoundingClientRect().top - (hd ? hd.getBoundingClientRect().bottom : 0) - 8; }
$('bStartSet').addEventListener('click', goStartSettings);
$('bStartSet2').addEventListener('click', () => { openSheet(); setTimeout(goStartSettings, 30); });
$('bClose').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('sheet').hidden) closeSheet(); });

/* 가로 배경 다이얼 눈금 */
(() => { const g = $('ticks'); let h = ''; for (let a = -120; a <= 120; a += 10) { const r = a * Math.PI / 180, big = a % 30 === 0, r1 = big ? 150 : 158, r2 = 170; h += `<line x1="${200 + r1 * Math.sin(r)}" y1="${200 - r1 * Math.cos(r)}" x2="${200 + r2 * Math.sin(r)}" y2="${200 - r2 * Math.cos(r)}" stroke-width="${big ? 3 : 1.5}"/>`; } g.innerHTML = h; })();

/* 소리 켜기: 브라우저는 첫 터치 전에는 소리를 막음 */
let unlocked = false;
function unlock() {
  if (unlocked) return; unlocked = true; $('tap').hidden = true;
  ensureAudio(); applyOrient(); if (watchId != null || simTimer) lockScreen(); if (watchId != null || simTimer) { chime(1, 988); say(T('say_start')); }
}
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, unlock, { capture: true }));

bindSettings(); applyLang(); gauge(null, S.far); setState('stReady'); saveS();
try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('any').catch(() => {}); } catch (e) {}
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
(async () => {
  try { const c = await dbGet('cams'); const m = await dbGet('meta'); if (Array.isArray(c) && c.length) { all = c; meta = m || null; applyFilter(); showMeta(); } } catch (e) {}
  if (!all.length) { setState('stNeedData'); openSheet(); msg(T('needDataCsv')); return; }
  if (S.auto) { start(); if (!unlocked && S.mode !== 'off') $('tap').hidden = false; }
  else setState('stPressStart');
})();

}
